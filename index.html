<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Fun Park</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#102d62;overflow:hidden}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#102d62}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#102d62;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:24px;z-index:2}
.spinner{width:52px;height:52px;border:6px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.retry{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:17px;cursor:pointer}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div>English Fun Park загружается…</div></div>
<iframe id="game" title="English Fun Park" allow="autoplay" sandbox="allow-scripts allow-same-origin allow-modals allow-forms"></iframe>
<script>
(async()=>{
 const loading=document.getElementById('loading'),frame=document.getElementById('game');
 const BASE='https://mamasha1804-lab.github.io/english-fun-park/';
 const VERSION='20260829-8';
 const fail=(m)=>loading.innerHTML='<div style="font-size:22px;font-weight:700">Не удалось загрузить игру.</div><div>'+m+'</div><button class="retry" onclick="location.reload()">ОБНОВИТЬ</button>';
 try{
   const get=async p=>{const r=await fetch(BASE+p+'?v='+VERSION,{cache:'no-store'});if(!r.ok)throw new Error(p+' '+r.status);return r.text()};
   const app=await Promise.all(['app/part1.txt','app/part2.txt','app/part3.txt','app/part4.txt'].map(get));
   const art=await Promise.all(['assets/home01.txt','assets/home02.txt','assets/home03.txt','assets/home04.txt'].map(get));
   let html=app.join('');
   html=html.replace('<head>','<head><base href="'+BASE+'">');
   html=html.replace('data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==','data:image/jpeg;base64,'+art.join(''));
   html=html.replace('function startGame(game){state.round=0;','function startGame(game){state.round=0;state._score=0;');
   html=html.replace("; if(game==='g5') setTimeout(()=>show('final'),700);",";");
   frame.addEventListener('load',()=>{setTimeout(()=>loading.style.display='none',250)},{once:true});
   frame.srcdoc=html;
 }catch(e){console.error(e);fail('Проверьте интернет и нажмите «Обновить».')}
})();
</script>
</body>
</html>
