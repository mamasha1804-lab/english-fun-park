<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Fun Park</title><style>html,body{margin:0;background:#102d62;min-height:100%}</style></head><body><script>(async()=>{try{const files=['app/part1.txt','app/part2.txt','app/part3.txt','app/part4.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error(f);return r.text()}));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<div style="font:20px Arial;color:white;padding:30px">English Fun Park is loading. Please refresh the page.</div>';console.error(e)}})();</script></body></html>
