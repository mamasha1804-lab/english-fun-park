name: Deploy English Fun Park to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build direct static game
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/assets
          cat app/part1.txt app/part2.txt app/part3.txt app/part4.txt > dist/index.html

          if [ -f "assets/home-original.png" ]; then
            cp "assets/home-original.png" dist/assets/home.png
            HOME_ASSET="assets/home.png"
          elif [ -f "assets/home-original (1).png" ]; then
            cp "assets/home-original (1).png" dist/assets/home.png
            HOME_ASSET="assets/home.png"
          else
            cat assets/ultra01.b64 assets/ultra02.b64 assets/ultra03.b64 assets/ultra04.b64 assets/ultra05.b64 | base64 -d > dist/assets/home.jpg
            HOME_ASSET="assets/home.jpg"
          fi

          HOME_ASSET="$HOME_ASSET" python3 - <<'PY'
          from pathlib import Path
          import os, re

          asset=os.environ['HOME_ASSET']
          p=Path('dist/index.html')
          html=p.read_text(encoding='utf-8')
          html=html.replace('function startGame(game){state.round=0;', 'function startGame(game){state.round=0;state._score=0;')
          html=html.replace("; if(game==='g5') setTimeout(()=>show('final'),700);", ';')
          placeholder='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=='
          html=html.replace(placeholder, asset, 1)
          html=re.sub(r'<script>\s*\(async\(\)=>\{try\{const ps=\[\];for\(let i=1;i<=4;i\+\+\).*?</script>', '', html, flags=re.S)
          p.write_text(html, encoding='utf-8')

          image=Path('dist/'+asset).read_bytes()
          if asset.endswith('.png'):
              if not image.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit('Original home PNG is invalid')
              if len(image) < 1000000:
                  raise SystemExit('Original home PNG unexpectedly small')
          else:
              if not image.startswith(b'\xff\xd8') or not image.endswith(b'\xff\xd9'):
                  raise SystemExit('Fallback home JPEG is invalid')
          print('Home artwork:', asset, len(image), 'bytes')
          PY

      - name: Validate complete game
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('dist/index.html').read_text(encoding='utf-8')
          required=['English Fun Park','Учимся с Ларисой Коротаевой','HELLO CAROUSEL','NAME BALLOONS','ABC SHOOTER','WORD COASTER','MYSTERY BOX','FINAL PRIZE','ant','bed','cat','dog','egg','flag','glass','horse','id="home"','id="g1"','id="g2"','id="g3"','id="g4"','id="g5"','id="final"']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing: '+', '.join(missing))
          if '<iframe' in html.lower(): raise SystemExit('Unexpected iframe')
          if not ('src="assets/home.png"' in html or 'src="assets/home.jpg"' in html):
              raise SystemExit('Home image reference missing')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          for i,script in enumerate(scripts,1): Path(f'/tmp/game-script-{i}.js').write_text(script,encoding='utf-8')
          print('Validated JS blocks:',len(scripts))
          PY
          for f in /tmp/game-script-*.js; do node --check "$f"; done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
